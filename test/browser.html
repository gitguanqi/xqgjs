<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>browser · xqgjs</title>
    <link rel="icon" href="./img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./demo.css">
</head>

<body>
    <header class="page">
        <img src="./img/logo.svg" alt="">
        <div>
            <h1>UMD 构建（未压缩）</h1>
            <p>通过 <code>&lt;script src="../lib/xqgjs.js"&gt;</code> 加载，检查全局名、实例方法与 DOM 能力。</p>
        </div>
    </header>

    <nav class="pages" aria-label="页面导航">
        <a href="./index.html">索引</a>
        <a href="./browser.html" aria-current="page">browser</a>
        <a href="./browser-min.html">browser.min</a>
        <a href="./esm.html">esm</a>
        <a href="./esm-min.html">esm.min</a>
        <a href="./validate.html">validate</a>
        <a href="./storage.html">storage</a>
        <a href="./net.html">net</a>
        <a href="./file.html">file</a>
        <a href="./plugins.html">plugins</a>
        <a href="./loading.html">loading</a>
        <a href="./mourn.html">mourn</a>
    </nav>

    <div class="summary" id="summary">PENDING</div>
    <ol id="checks"></ol>

    <section class="demo">
        <h2>可交互示例</h2>
        <h3 id="demoTitle">点击下面的按钮修改这一行</h3>
        <div class="row">
            <button id="btnText">改文字</button>
            <button id="btnClass">切换高亮</button>
            <button id="btnReset">还原</button>
        </div>
        <pre class="out" id="output">等待操作…</pre>
    </section>

    <script src="../lib/xqgjs.js"></script>
    <script src="./helpers/harness.js"></script>
    <script>
        const el = (tag, attrs) => {
            const node = document.createElement(tag || 'div');
            Object.keys(attrs || {}).forEach((key) => node.setAttribute(key, attrs[key]));
            return node;
        };

        XQTest.test('两个全局名指向同一个对象', () => {
            XQTest.eq(typeof window.gjs, 'function', 'window.gjs');
            XQTest.eq(window.gjs, window.$g, 'gjs and $g must be identical');
            XQTest.eq(window.$g, gjs, 'the bare global must be the same object');
        });

        XQTest.test('info 描述了当前版本', () => {
            XQTest.eq(gjs.info.name, 'gjs');
            XQTest.ok(/^v\d+\.\d+\.\d+$/.test(gjs.info.version), 'version format: ' + gjs.info.version);
            XQTest.ok(/^\d{4}-\d{2}-\d{2}$/.test(gjs.info.date), 'date format: ' + gjs.info.date);
        });

        XQTest.test('公开方法都在', () => {
            const expected = ['checkEmail', 'secondToTime', 'getUrlArgs', 'http', 'each', 'ready',
                'addCls', 'hasCls', 'downloadFile', 'exportExcel', 'setLocal', 'getCookie'];
            for (const name of expected) XQTest.eq(typeof gjs[name], 'function', name);
            for (const name of ['Drag', 'Tab', 'Carousels', 'xqRecord']) XQTest.eq(typeof gjs[name], 'function', name);
        });

        XQTest.test('init 支持选择器与元素，并在未命中时给出 length 0', () => {
            const box = el('div', { id: 'probe' });
            document.body.appendChild(box);

            XQTest.eq(gjs('#probe')[0], box, 'selector');
            XQTest.eq(gjs('#probe').length, 1, 'length');
            XQTest.eq(gjs(box)[0], box, 'element');
            XQTest.eq(gjs('#nope').length, 0, 'missing element reports length 0');
            box.remove();
        });

        XQTest.test('属性读写与删除可以链式调用', () => {
            const box = gjs(el('div', { id: 'attrs' }));
            document.body.appendChild(box[0]);

            XQTest.eq(box.setAttr('data-role', 'demo'), box, 'setAttr returns the instance');
            XQTest.eq(box.getAttr('data-role'), 'demo');
            box.delAttr('data-role');
            XQTest.eq(box.getAttr('data-role'), null);
            box[0].remove();
        });

        XQTest.test('css 一次写入全部属性', () => {
            const box = gjs(el('div', { id: 'styles' }));
            document.body.appendChild(box[0]);

            box.css({ color: 'rgb(255, 0, 0)', fontSize: '18px', letterSpacing: '2px' });
            const style = box[0].style;
            XQTest.eq(style.color, 'rgb(255, 0, 0)', 'color');
            XQTest.eq(style.fontSize, '18px', 'fontSize');
            XQTest.eq(style.letterSpacing, '2px', 'letterSpacing');
            box[0].remove();
        });

        XQTest.test('类名操作互不干扰', () => {
            const box = gjs(el('div', { id: 'classes' }));
            document.body.appendChild(box[0]);

            box.addCls('a b').addCls(['c']);
            XQTest.eq(box.hasCls('c'), true, 'addCls with an array');
            box.delCls('a c');
            XQTest.eq(box.hasCls('a'), false, 'delCls');
            XQTest.eq(box.hasCls('b'), true, 'unrelated class kept');
            box.toggleCls('b');
            XQTest.eq(box.hasCls('b'), false, 'toggle without force');
            box.toggleCls('b', true);
            XQTest.eq(box.hasCls('b'), true, 'toggle with force');
            box[0].remove();
        });

        XQTest.test('each 遍历数组与对象，返回 false 时中断', () => {
            const seen = [];
            const list = [1, 2, 3];
            XQTest.eq(gjs.each(list, (index, value) => seen.push(value)), list);
            XQTest.eq(seen.join(','), '1,2,3');

            const stopped = [];
            gjs.each([1, 2, 3], (index, value) => {
                stopped.push(value);
                return value < 2;
            });
            XQTest.eq(stopped.join(','), '1,2', 'break on false');

            const keys = [];
            gjs.each({ x: 1, y: 2 }, (key) => keys.push(key));
            XQTest.eq(keys.sort().join(','), 'x,y');
        });

        XQTest.test('on / off 绑定与解绑', () => {
            const box = el('div', { id: 'events' });
            document.body.appendChild(box);
            let clicks = 0;
            const handler = () => { clicks += 1; };

            gjs('#events').on('click', handler);
            box.click();
            XQTest.eq(clicks, 1, 'after on');
            gjs('#events').off('click', handler);
            box.click();
            XQTest.eq(clicks, 1, 'after off');
            box.remove();
        });

        XQTest.test('ready 在解析中延后，就绪后立即执行', async () => {
            XQTest.eq(document.readyState, 'loading', 'the inline suite runs while the document is still parsing');
            let ran = 0;
            gjs.ready(() => { ran += 1; });
            XQTest.eq(ran, 0, 'must not run before DOMContentLoaded');
            await new Promise((resolve) => {
                document.addEventListener('DOMContentLoaded', resolve, { once: true });
            });
            XQTest.eq(ran, 1, 'runs once the document is ready');

            let again = 0;
            gjs.ready(() => { again += 1; });
            XQTest.eq(again, 1, 'runs synchronously when the document is already parsed');
        });

        XQTest.test('DOM 增删改查', () => {
            const parent = gjs(el('div', { id: 'dom' }));
            document.body.appendChild(parent[0]);
            const child = el('span', { id: 'child' });

            gjs.addElem(parent[0], child);
            XQTest.eq(document.getElementById('child'), child, 'addElem');
            XQTest.eq(gjs.parent(child), parent[0], 'parent');
            gjs.delElem(parent[0], child);
            XQTest.eq(document.getElementById('child'), null, 'delElem');
            parent[0].remove();
        });

        XQTest.test('extend 与原型链保持一致', () => {
            gjs.extend({ __probe: 'ok' });
            XQTest.eq(gjs.__probe, 'ok');
            XQTest.eq(gjs.fn.init.prototype, gjs.fn, 'init.prototype must stay Gjs.fn');
            XQTest.ok(gjs('#nope') instanceof gjs, 'instances must be instanceof gjs');
        });

        XQTest.test('8 个校验函数可用', () => {
            XQTest.eq(gjs.checkEmail('user@example.com'), true, 'checkEmail');
            XQTest.eq(gjs.checkEmail('user@example'), false, 'checkEmail negative');
            XQTest.eq(gjs.checkMobile('13800138000'), true, 'checkMobile');
            XQTest.eq(gjs.checkName('张三'), true, 'checkName');
            XQTest.eq(gjs.checkPassword, gjs.checkpassWord, 'alias');
        });

        XQTest.test('secondToTime 边界正确', () => {
            XQTest.eq(gjs.secondToTime(10), '00:00:10');
            XQTest.eq(gjs.secondToTime(600), '00:10:00');
            XQTest.eq(gjs.secondToTime(3661), '01:01:01');
        });

        // 交互示例：验证实例方法在真实点击下仍然有效
        const title = gjs('#demoTitle');
        const output = document.getElementById('output');

        document.getElementById('btnText').addEventListener('click', () => {
            title.text('已由 gjs 改写');
            output.textContent = 'text() 生效：' + title[0].textContent;
        });

        document.getElementById('btnClass').addEventListener('click', () => {
            title.toggleCls('highlight');
            output.textContent = 'toggleCls 生效：' + title[0].className;
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            title[0].className = '';
            title.text('点击下面的按钮修改这一行');
            output.textContent = '已还原';
        });

        XQTest.run();
    </script>
</body>

</html>
