<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>esm · xqgjs</title>
    <link rel="icon" href="./img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./demo.css">
</head>

<body>
    <header class="page">
        <img src="./img/logo.svg" alt="">
        <div>
            <h1>ESM 构建（未压缩）</h1>
            <p><code>import gjs from '../lib/xqgjs-esm.js'</code>。这条路径之前在严格模式下导入即崩。</p>
        </div>
    </header>

    <nav class="pages" aria-label="页面导航">
        <a href="./index.html">索引</a>
        <a href="./browser.html">browser</a>
        <a href="./browser-min.html">browser.min</a>
        <a href="./esm.html" aria-current="page">esm</a>
        <a href="./esm-min.html">esm.min</a>
        <a href="./validate.html">validate</a>
        <a href="./storage.html">storage</a>
        <a href="./net.html">net</a>
        <a href="./file.html">file</a>
        <a href="./plugins.html">plugins</a>
        <a href="./loading.html">loading</a>
        <a href="./mourn.html">mourn</a>
    </nav>

    <div class="summary" id="summary">PENDING</div>
    <ol id="checks"></ol>

    <section class="demo">
        <h2>可交互示例</h2>
        <p id="demoText">ESM 默认导出可以直接调用。</p>
        <div class="row">
            <button id="btnDemo">改写文本</button>
        </div>
    </section>

    <script src="./helpers/harness.js"></script>
    <script type="module">
        import gjs from '../lib/xqgjs-esm.js';

        XQTest.test('模块导入成功且默认导出可调用', () => {
            XQTest.eq(typeof gjs, 'function');
            XQTest.ok(/^v\d+\.\d+\.\d+$/.test(gjs.info.version), gjs.info.version);
        });

        XQTest.test('ESM 不写全局', () => {
            XQTest.eq(typeof window.gjs, 'undefined', 'window.gjs must stay undefined');
            XQTest.eq(typeof window.$g, 'undefined', 'window.$g must stay undefined');
        });

        XQTest.test('实例与原型链可用', () => {
            XQTest.eq(gjs.fn.init.prototype, gjs.fn);
            const box = gjs('#demoText');
            XQTest.eq(box.length, 1);
            XQTest.ok(box instanceof gjs);
        });

        XQTest.test('校验函数在严格模式下不抛 ReferenceError', () => {
            XQTest.eq(gjs.checkEmail('user@example.com'), true);
            XQTest.eq(gjs.checkMobile('13800138000'), true);
            XQTest.eq(gjs.checkCardId('110101199003071234'), true);
        });

        XQTest.test('插件构造器都导出了', () => {
            for (const name of ['Drag', 'Tab', 'Carousels', 'xqRecord']) {
                XQTest.eq(typeof gjs[name], 'function', name);
            }
        });

        XQTest.test('secondToTime 与 getUrlArgs 正常', () => {
            XQTest.eq(gjs.secondToTime(10), '00:00:10');
            XQTest.eq(JSON.stringify(gjs.getUrlArgs('?a=1')), '{"a":"1"}');
            XQTest.eq(JSON.stringify(gjs.getUrlArgs('https://a.com/p')), '{}');
        });

        XQTest.test('存储读写往返', () => {
            gjs.setLocal('esm-probe', 'a b&c');
            XQTest.eq(gjs.getLocal('esm-probe'), 'a b&c');
            gjs.rmLocal('esm-probe');
            XQTest.eq(gjs.getLocal('esm-probe'), null);
        });

        document.getElementById('btnDemo').addEventListener('click', () => {
            gjs('#demoText').text('ESM 实例已改写这段文字');
        });

        XQTest.run();
    </script>
</body>

</html>
